<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הלוחות שלי - Pinterest</title>
    <link rel="stylesheet" href="feed.css">
    <link rel="stylesheet" href="boards.css">
</head>
<body>

<header>
    <div class="profile-menu">
        <button id="profileBtn" type="button" class="profile-btn">
            <img id="profileImg" src="icons/profileLogo.png" alt="Profile">
            <img src="icons/arrow.png" alt="arrow" class="profile-arrow">
        </button>

        <div id="profileDropdown" class="profile-dropdown">
            <div class="profile-dropdown-header">
                <label for="profileImageInput" class="profile-image-wrapper" title="שינוי תמונת פרופיל">
                    <img id="profileDropdownImg" src="icons/profileLogo.png" alt="Profile">
                    <span class="profile-image-edit-overlay">שינוי תמונה</span>
                </label>
                <input type="file" id="profileImageInput" accept="image/*" hidden>
                <span id="profileUsername" class="profile-dropdown-username"></span>
            </div>
            <hr class="profile-dropdown-divider">
            <button id="logoutBtn" type="button" class="profile-logout-btn" onclick="handleLogout()">התנתקות</button>
        </div>
    </div>
    <div>
       <input type="text" id="searchInput" placeholder="חיפוש">
    </div>
    <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    <button id="threeDots" onclick="toggleThreeDotsMenu()">⋮</button>
</header>

<nav>
    <a href="#">
        <img src="icons/pinterest_logo.png" class="logo-light" alt="Pinterest Light">
        <img src="icons/pinterest_logo-1empty.png" class="logo-dark" alt="Pinterest Dark">
    </a>
    <a href="feed.html"><img src="icons/homeLogo1.png"></a>
    <a href="boards.html"><img src="icons/boardsLogo1.png"></a>
    <div class="create-post-container">
        <button id="createPost"><img src="icons/createLogo1.png"></button>
    </div>
    <div class="messages-container">
        <button id="messagesButton"><img src="icons/notifLogo1.png"></button>
        <span id="badge" class="badge">0</span>
    </div>
    <a href="#"><img src="icons/messageLogo1.png"></a>
    <a href="#"><img src="icons/settingsLogo1.png"></a>
</nav>

<div id="pinsFilterBar" class="pins-filter-bar">
    <div class="filter-group">
        <label for="likesRangeFilter">טווח לייקים 📌</label>
        <select id="likesRangeFilter"></select>
    </div>
    <div class="filter-group">
        <label for="postTypeFilter">סוג פוסט</label>
        <select id="postTypeFilter">
            <option value="all">הכל</option>
            <option value="TEXT">טקסט</option>
            <option value="IMAGE">תמונה</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="aspectRatioFilter">יחס גובה-רוחב</label>
        <select id="aspectRatioFilter">
            <option value="all">הכל</option>
            <option value="portrait">לאורך</option>
            <option value="landscape">לרוחב</option>
            <option value="square">ריבועי</option>
        </select>
    </div>
    <button type="button" id="resetPinsFiltersBtn" class="reset-filters-btn">איפוס סינון</button>
</div>

<div class="boards-page-container" id="boardsPageContainer">
    <div class="new-board-inline">
        <button type="button" class="tab-btn active" onclick="switchTab(this, 'pins'); renderSavedPinsTab();">סיכות</button>
        <button type="button" class="tab-btn" onclick="switchTab(this, 'boards'); loadBoards();">לוחות</button>
    </div>

    <div id="boardsGrid" class="boards-grid"></div>

    <p id="noBoardsMessage" class="no-boards-text" style="display:none;">
        עדיין לא שמרת שום דבר 📌
    </p>
</div>

<div id="boardPinsSection" class="board-pins-section" style="display:none;">
    <h2 id="boardPinsTitle"></h2>
    
    <div class="board-actions">
        <button class="back-to-boards-btn" type="button" onclick="closeBoardView()">⟵ חזרה ללוחות</button>
        <button class="add-pins-to-board-btn" type="button" onclick="openAddPinsModal()">+הוספת תמונות ללוח</button>
    </div>

    <div id="boardPinsGrid" class="boards-grid"></div>
</div>


<script src="boards.js"></script>
</body>
</html>
