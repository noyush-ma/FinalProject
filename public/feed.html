
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pinterest</title>
    <link rel="stylesheet" href="feed.css">
</head>
<body>

<header>
    <div class="profile-menu">
        <button id="profileBtn" type="button" class="profile-btn">
            <img id="profileImg" src="icons/profileLogo.png" alt="Profile">
            <img src="icons/arrow.png" alt="arrow" class="profile-arrow">
        </button>

        <div id="profileDropdown" class="profile-dropdown">
            <div class="profile-dropdown-header">
                <label for="profileImageInput" class="profile-image-wrapper" title="שינוי תמונת פרופיל">
                    <img id="profileDropdownImg" src="icons/profileLogo.png" alt="Profile">
                    <span class="profile-image-edit-overlay">שינוי תמונה</span>
                </label>
                <input type="file" id="profileImageInput" accept="image/*" hidden>
                <span id="profileUsername" class="profile-dropdown-username"></span>
            </div>
            <hr class="profile-dropdown-divider">
            <button id="logoutBtn" type="button" class="profile-logout-btn" onclick="handleLogout()">התנתקות</button>
        </div>
    </div>
    <div>
       <input type="text" id="searchInput" placeholder="חיפוש">
    </div>
    <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    <button id="threeDots" onclick="toggleThreeDotsMenu()">⋮</button>
</header>

<div id="filterDropdown" class="filter-dropdown">
    <button onclick="filterImages('all')">הכל</button>
    <button onclick="filterImages('nature')">טבע ונופים</button>
    <button onclick="filterImages('animals')">בעלי חיים</button>
    <button onclick="filterImages('urban')">עירוני </button>
    <button onclick="filterImages('places')">מקומות</button>
    <button onclick="filterImages('movies')">סרטים</button>
    <button onclick="filterImages('food & drinks')">אוכל ומשקאות</button>
    <button onclick="filterImages('arts')">אמנות</button>
    <button onclick="filterImages('celebrity')">מפורסמים</button>
    <button onclick="filterImages('beauty')">טיפוח ואיפור</button>
    <button onclick="filterImages('general')">כללי</button>
</div>

    <nav>
        <a href="#">
            <img src="icons/pinterest_logo.png" class="logo-light" alt="Pinterest Light">
            <img src="icons/pinterest_logo-1empty.png" class="logo-dark" alt="Pinterest Dark">
        </a>
        <a href="#"><img src="icons/homeLogo1.png"></a>
        <a href="boards.html"><img src="icons/boardsLogo1.png"></a>

        <div class="create-post-container">
            <button id="createPost"><img src="icons/createLogo1.png"></button>
        </div>
        <div class="messages-container">
            <button id="messagesButton"><img src="icons/notifLogo1.png"></button>
            <span id="badge" class="badge">0</span>
        </div>
        <a href="#"><img src="icons/messageLogo1.png"></a>
        <a href="#"><img src="icons/settingsLogo1.png"></a>
    </nav>

<div class="images" id="postsContainer">
</div>

<div id="noResultsMessage" class="no-results">
    לא נמצאו תוצאות תואמות לחיפוש שלך 
</div>

<div id="imageModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        
        <div class="modal-left-side">
            <img id="modalImg" src="" alt="Modal Image">
        </div>
        
        <div class="modal-right-side">
            <div class="modal-top-actions">
                <div class="modal-icons-group">
                    <div class="like-container">
                        <span id="like-count"></span> 
                        <button id="likeBtn" onclick="doLike()">
                            <img id="heartIcon" src="icons/emptyHeart.png" alt="Like"> 
                        </button>
                    </div>

                    <button class="action-icon-btn" onclick="focusCommentInput()">
                        <img src="icons/commentLogo.png" alt="Comment" class="modal-svg-icon">
                    </button>

                    <button class="action-icon-btn" onclick="openShareModal()">
                        <img src="icons/shareLogo.png" alt="Share" class="modal-svg-icon">
                    </button>

                    <button class="action-icon-btn">
                        <img src="icons/threedotsLogo.png" alt="dots" class="modal-svg-icon">
                    </button>

                    <div class="delete-dropdown-container">
                        <button class="action-icon-btn" onclick="toggleDeleteMenu(event)">
                            <img src="icons/arrow.png" alt="Arrow" class="modal-svg-icon arrow-flip">
                        </button>
                        <div id="deleteDropdown" class="delete-dropdown">
                            <button onclick="deleteCurrentPost()">מחק פוסט</button>
                        </div>
                    </div>
                </div>
                
                <button id="saveBtn" class="save-button" onclick="doSave()">שמירה</button>
            </div>
            
            <div class="modal-info">
                <p id="modalDesc"></p>
                <div id="modalUsername" class="creator-username">username</div>
            </div>

            <div class="comments-section">
                <div class="comments-toggle" onclick="toggleComments()">
                    <span id="comments-title-text">הערות (0)</span>
                    <span id="accordionArrow" class="accordion-arrow">▼</span>
                </div>

                <div id="commentsList" class="comments-list" style="display: none;">
                </div>

                <div class="comment-input-area">
                    <div id="typingIndicator" style="display: none;">...</div>
                    <div class="input-row">
                        <div class="input-container-with-icons">
                            <input type="text" id="newCommentInput" placeholder="הוסיפו הערה כדי להתחיל שיחה" oninput="showTyping()">
                            <div class="input-embed-icons">
                                <img src="icons/emoji.png" alt="emoji" class="embed-icon">
                                <img src="icons/sticker.png" alt="sticker" class="embed-icon">
                                <img src="icons/picture.png" alt="picture" class="embed-icon">
                            </div>
                        </div>
                        <button id="sendCommentBtn" onclick="addComment()">שלח</button>
                    </div>
                </div>
            </div>
        </div> 
    </div> 
</div>

<div id="shareModal" class="share-pop" onclick="closeShareModal()">
    <div class="share-pop-content" onclick="event.stopPropagation()">
        <span class="share-close" onclick="closeShareModal()">&times;</span>
        <h2 class="share-title">שיתוף</h2>
        <img src="icons/share.png" alt="Share Options" class="share-static-img">
        <input type="text" id="searchEmail" placeholder="חיפוש לפי דואר אלקטרוני">
        <div class="share-users-list">
            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">Maya</span>
                    <span class="user-handle">@mayastar_1</span>
                </div>
                <div class="user-avatar" style="background-color: #ffb6c1;">M</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">Tom_Design 🎨</span>
                    <span class="user-handle">@tom_creative</span>
                </div>
                <div class="user-avatar" style="background-color: #add8e6;">T</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">דניאל אברהם</span>
                    <span class="user-handle">@daniel_ab10</span>
                </div>
                <div class="user-avatar" style="background-color: #98fb98;">ד</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">Noa ✨🌊</span>
                    <span class="user-handle">@noas_vibes</span>
                </div>
                <div class="user-avatar" style="background-color: #e6e6fa;">N</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">Liam</span>
                    <span class="user-handle">@liam_shani</span>
                </div>
                <div class="user-avatar" style="background-color: #ffe4e1;">L</div>
            </div>
        </div>
    </div>
</div>

<div id="saveBoardModal" class="share-pop" onclick="closeSaveBoardModal()">
    <div class="share-pop-content save-board-content" onclick="event.stopPropagation()">
        <span class="share-close" onclick="closeSaveBoardModal()">&times;</span>
        <h2 class="share-title">שמירה ללוח</h2>

        <div id="userBoardsList" class="boards-select-list">
            <!-- הלוחות של המשתמש המחובר ייטענו כאן דינמית -->
        </div>

        <div class="new-board-row">
            <input type="text" id="newBoardNameInput" placeholder="שם ללוח חדש">
            <button id="createBoardBtn" type="button" onclick="createBoardAndSave()">יצירה ושמירה</button>
        </div>
    </div>
</div>

 <div id="postModal" class="modalP">
    <div class="modalP-content post-modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2>create new post</h2>

        <form id="postForm">
            <input type="text" id="title" placeholder="Title" required>
            <input type="text" id="imgUrl" placeholder="Image URL" required>
            <textarea id="description" placeholder="Description"></textarea>

            <select id="category">
                <option value="nature">nature</option>
                <option value="animals">animals</option>
                <option value="urban">urban</option>
                <option value="places">places</option>
                <option value="movies">movies</option>
                <option value="food & drinks">food & drinks</option>
                <option value="arts">arts</option>
                <option value="celebrity">celebrity</option>
                <option value="beauty">beauty</option>
                <option value="general">general</option>
            </select>

            <select id="postType">
                <option value="IMAGE">IMAGE</option>
                <option value="TEXT">TEXT</option>
                <option value="COMBINED">COMBINED</option>
            </select>

            <button type="submit">Post</button>
        </form>
    </div>
</div>

<button id="scrollToTopBtn" onclick="scrollToTop()">⬆</button>

<script src="feed.js"></script>
</body>
</html>
