<html>
    
<head>
    <link rel="stylesheet" href="signUp.css">
    <title>Sign Up Page</title>
</head>

<body>
    <h1>Sign Up</h1>

    <div>
        <img src="pinterest_logo.png" alt="logo">
    </div>
    
    <div>
        <h2>Welcome To Pinterest</h2>
        <h3>Explore And Find New Ideas</h3> 
    </div>
    
    <div>
        <p>username</p>
        <input type="email" id="name">
        <p id="emailError" class="error"></p>
    </div>

    <div>
        <p>password</p>
        <input type="password" id="password">
        <p id="passwordError" class="error"></p>
    </div>

    <div class = "text">
        <p id ="info">DISCOVER NEW IDEAS ON <br>PINTEREST <br><br><br>
            FIND NEW AESTHETIC <br><br><br>SHARE YOUR LIFE STYLE</p>
    </div>
    <div class="images">
        <img src="picture3.jpg" alt="pic3" id="pic3">
        <img src="picture2.jpg" alt="pic2" id="pic2">
        <img src="picture1.jpg" alt="pic1" id="pic1">
    </div>

    <br><br>
    
    <button onclick="checkForm()">Enter</button>
    <script src="login.js"></script>

    
</body>

</html>
