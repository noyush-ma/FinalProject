<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הוספת פוסט חדש</title>
  <link rel="stylesheet" href="addPost.css">
</head>
<body>

  <div class="card">
    <h2>צור פוסט חדש</h2>
    <form id="postForm">
      <label for="title">כותרת:</label>
      <input type="text" id="title" required placeholder="הכנס כותרת לפוסט">

      <label for="imgUrl">קישור לתמונה (URL):</label>
      <input type="url" id="imgUrl" required placeholder="https://example.com/image.jpg">

      <label for="description">תיאור:</label>
      <textarea id="description" rows="4" placeholder="תאר את הפוסט..."></textarea>

      <button type="submit">פרסם פוסט</button>
    </form>
  </div>

  <script src="addPost.js"></script>
</body>
</html>
