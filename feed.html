<html>

    <html dir="rtl"></html>

    <head>

        <title>Pinterest</title>
    <link rel="stylesheet" href="feed.css">
</head>
<body>

    <header>
        <img src="profileLogo.png" alt="Profile">
        <img src="arrow.png" alt="arrow">
        <div>
           <input type="text" placeholder="חיפוש">
        </div>
    </header>

    <nav>
        <a href="#"><img src="pinterestLogo1.png"></a>
        <a href="#"><img src="homeLogo1.png"></a>
        <a href="#"><img src="boardsLogo1.png"></a>
        <a href="#"><img src="createLogo1.png"></a>
        <a href="#"><img src="notifLogo1.png"></a>
        <a href="#"><img src="messageLogo1.png"></a>
        <a href="#"><img src="settingsLogo1.png"></a>
    </nav>

<div class="images">
    <div>
        <img src="view.png" alt="view" onclick="openModal(this)">
    </div>
    <div>
        <img src="flower.png" alt="flower" onclick="openModal(this)">
    </div>
    <div>
        <img src="koala.png" alt="koala" onclick="openModal(this)">
    </div>
    <div>
        <img src="sea.png" alt="sea" onclick="openModal(this)">
    </div>
    <div>
        <img src="dog.png" alt="dog" onclick="openModal(this)">
    </div>
    <div>
        <img src="cat.png" alt="cat" onclick="openModal(this)">
    </div>
</div>

<div id="imageModal" class="modal">
    <span class="close-btn" onclick="closeModal()">X</span>
    
    <div class="modal-content">
        <img id="modalImg" src="" alt="תמונה מוגדלת">
        
        <div>
            <button id="likeBtn" onclick="doLike()">❤️לייק</button>
            <button id="saveBtn">📌שמירה</button>
        </div>
    </div>
</div>

<script src="feed.js"></script>

</body>

</html>
