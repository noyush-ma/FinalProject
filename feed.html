<html dir="rtl">
<head>
    <title>Pinterest</title>
    <link rel="stylesheet" href="feed.css">
</head>
<body>

    <header>
        <img src="profileLogo.png" alt="Profile">
        <img src="arrow.png" alt="arrow">
        <div>
           <input type="text" id="searchInput" placeholder="חיפוש">
        </div>
        <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    </header>

    <nav>
        <a href="#">
            <img src="pinterest_logo.png" class="logo-light" alt="Pinterest Light">
            <img src="pinterest_logo-1empty.png" class="logo-dark" alt="Pinterest Dark">
        </a>
        <a href="#"><img src="homeLogo1.png"></a>
        <a href="#"><img src="boardsLogo1.png"></a>
        <div class="create-post-container">
            <button id="createPost" onclick="openCreatePostModal()"><img src="createLogo1.png"></button>
        </div>
        <div class="messages-container">
            <button id="messagesButton"><img src="notifLogo1.png"></button>
            <span id="badge" class="badge">0</span>
        </div>
        <a href="#"><img src="messageLogo1.png"></a>
        <a href="#"><img src="settingsLogo1.png"></a>
    </nav>

<div class="images">

        <img src="koala.png" alt="koala" data-likes="38" data-username="Israel_zoo" data-description="our cute koala!" onclick="openModal(this)">

    <div class="post-card">
        <img src="sea.png" alt="sea" data-likes="213" data-username="saritush" data-description="Sea in Spain!!" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="dog.png" alt="dog" data-likes="89" data-username="let_animals_live" data-description="our dog loee on a trip!!!" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="cat.png" alt="cat" data-likes="67" data-username="NASA" data-description="A cat from Florida is taking a pic with the moon" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="coffeeShop.png" alt="coffeeShop" data-likes="81" data-username="Eli_85" data-description="come to visit us at our new coffeeShop!" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="mall.png" alt="mall" data-likes="9" data-username="Sasha" data-description="at the mall!!" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="artsDrowings.png" alt="arts" data-likes="304" data-username="yarden_drows" data-description="Another drowing of mine" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="city.png" alt="city" data-likes="704" data-username="shoogi" data-description="USA" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="wallpaper.png" alt="wallpaper" data-likes="147" data-username="lauren" data-description="cute wallpaper!" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="minions.png" alt="minions" data-likes="999" data-username="Diseny" data-description="a happy birthday wish from the minions." onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="school.png" alt="school" data-likes="63" data-username="nehoray" data-description="i'm bored" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="cooking.png" alt="cooking" data-likes="79" data-username="cook_with_sharon" data-description="making chicken with vegetabales" onclick="openModal(this)">
    </div>
    <div class="post-card">
        <img src="rainbow.png" alt="rainbow" data-likes="516" data-username="Angel" data-description="a beautiful rainbow" onclick="openModal(this)">
    </div>
</div>

<div id="noResultsMessage" class="no-results">
    לא נמצאו תוצאות תואמות לחיפוש שלך 
</div>

<div id="imageModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        
        <div class="modal-left-side">
            <img id="modalImg" src="" alt="Modal Image">
        </div>
        
        <div class="modal-right-side">
            <div class="modal-top-actions">
                <div class="modal-icons-group">
                    <div class="like-container">
                        <span id="like-count"></span> 
                        <button id="likeBtn" onclick="doLike()">
                            <img id="heartIcon" src="emptyHeart.png" alt="Like"> 
                        </button>
                    </div>

                    <button class="action-icon-btn" onclick="focusCommentInput()">
                        <img src="commentLogo.png" alt="Comment" class="modal-svg-icon">
                    </button>

                    <button class="action-icon-btn" onclick="openShareModal()">
                        <img src="shareLogo.png" alt="Share" class="modal-svg-icon">
                    </button>

                    <button class="action-icon-btn">
                        <img src="threedotsLogo.png" alt="dots" class="modal-svg-icon">
                    </button>

                    <div class="delete-dropdown-container">
                        <button class="action-icon-btn" onclick="toggleDeleteMenu(event)">
                            <img src="arrow.png" alt="Arrow" class="modal-svg-icon arrow-flip">
                        </button>
                        <div id="deleteDropdown" class="delete-dropdown">
                            <button onclick="deleteCurrentPost()">מחק פוסט</button>
                        </div>
                    </div>
                </div>
                
                <button id="saveBtn" class="save-button" onclick="doSave()">שמירה</button>
            </div>
            
            <div class="modal-info">
                <p id="modalDesc"></p>
                <div id="modalUsername" class="creator-username">username</div>
            </div>

            <div class="comments-section">
                <div class="comments-toggle" onclick="toggleComments()">
                    <span id="comments-title-text">הערות (0)</span>
                    <span id="accordionArrow" class="accordion-arrow">▼</span>
                </div>

                <div id="commentsList" class="comments-list" style="display: none;">
                </div>

                <div class="comment-input-area">
                    <div id="typingIndicator" style="display: none;">...</div>
                    <div class="input-row">
                        <div class="input-container-with-icons">
                            <input type="text" id="newCommentInput" placeholder="הוסיפו הערה כדי להתחיל שיחה" oninput="showTyping()">
                            <div class="input-embed-icons">
                                <img src="emoji.png" alt="emoji" class="embed-icon">
                                <img src="sticker.png" alt="sticker" class="embed-icon">
                                <img src="picture.png" alt="picture" class="embed-icon">
                            </div>
                        </div>
                        <button id="sendCommentBtn" onclick="addComment()">שלח</button>
                    </div>
                </div>
            </div>
        </div> 
    </div> 
</div>

<div id="shareModal" class="share-pop" onclick="closeShareModal()">
    <div class="share-pop-content" onclick="event.stopPropagation()">
        <span class="share-close" onclick="closeShareModal()">&times;</span>
        <h2 class="share-title">שיתוף</h2>
        <img src="share.png" alt="Share Options" class="share-static-img">
        <input type="text" id="searchEmail" placeholder="חיפוש לפי דואר אלקטרוני">
        <div class="share-users-list">
            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">Maya</span>
                    <span class="user-handle">@mayastar_1</span>
                </div>

            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>

                    <span class="user-handle">@tom_creative</span>
                </div>
                <div class="user-avatar" style="background-color: #add8e6;">T</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">
                    <span class="user-display-name">דניאל אברהם</span>
                    <span class="user-handle">@daniel_ab10</span>
                </div>
                <div class="user-avatar" style="background-color: #98fb98;">ד</div>
            </div>

            <div class="share-user-item">
                <button class="send-user-btn">שליחה</button>
                <div class="user-info-text">

                <div class="user-info-text">
                    <span class="user-display-name">Liam</span>
                    <span class="user-handle">@liam_shani</span>
                </div>
                <div class="user-avatar" style="background-color: #ffe4e1;">L</div>
            </div>
        </div>
    </div>
</div>

<script src="feed.js"></script>

</body>
</html>
